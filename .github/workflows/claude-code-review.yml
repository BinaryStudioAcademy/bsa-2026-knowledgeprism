name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          use_sticky_comment: true
          include_fix_links: true
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against our strict team checklist:

            ## TypeScript & Type Safety
            - [ ] No `any` used. Prefer `unknown` with narrowing.

            ## Code Quality & Architecture
            - [ ] No dead code. Unused files, modules, and commented-out code must be removed.
            - [ ] No unused dependencies. `package.json` must be trimmed to actual imports (verified by knip).
            - [ ] No index files / barrel exports (except as an app/package entry point). Import from concrete paths.
            - [ ] DRY principle followed. Shared logic must be extracted into modules/helpers, not copy-pasted.
            - [ ] Short functions. Long functions/methods must be split up by individual concern.

            ## Constants & Variables
            - [ ] No magic values. Inline literals must be replaced with explanatory named constants.
            - [ ] Grouped constants. Related constants must use enums/const objects instead of standalone variables.
            - [ ] Immutable exports. Modules must not export mutable `let` bindings.

            ## Testing & Documentation
            - [ ] Unit tests for new functions.
            - [ ] Integration tests for new endpoints.
            - [ ] Edge cases covered with test coverage > 80%.
            - [ ] Documentation updated (README, API docs, CHANGELOG.md if needed).

            ## Security & Linters
            - [ ] No hardcoded credentials or sensitive data in logs.
            - [ ] Input validation and proper error handling implemented.
            - [ ] Linter compliance. Code matches `npm run lint` with absolutely NO inline `eslint-disable` comments.

            For each item, check if it's satisfied and comment on any that need attention.
            Post a summary comment with checklist results.
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5
            --append-system-prompt "Be concise and direct. Focus strictly on security issues, performance bugs, and edge cases. Do not comment on code formatting, style, or linting errors."
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
            --disallowedTools "Write,Edit"
