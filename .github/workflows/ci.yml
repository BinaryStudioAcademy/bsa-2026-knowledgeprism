name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - development

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Cache Dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
            packages/**/build
          key: ci-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ci-

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

  lint:
    name: Code Linting
    needs: dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore Dependencies
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
            packages/**/build
          key: ci-${{ hashFiles('**/package-lock.json') }}

      - name: Code Linting
        env:
          EC_VERSION: v3.11.2
        run: |
          npm run lint

  test:
    name: Tests
    needs: dependencies
    runs-on: ubuntu-latest
    env:
      BEDROCK_MAXIMUM_CONCURRENT_REQUESTS: 4

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore Dependencies
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
            packages/**/build
          key: ci-${{ hashFiles('**/package-lock.json') }}

      - name: Run API Tests
        run: npm test -w apps/api

      - name: Run Worker Tests
        run: npm test -w apps/worker

      - name: Run Web Tests
        run: npm test -w apps/web

  build:
    name: Code Building
    needs: dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore Dependencies
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
            packages/**/build
          key: ci-${{ hashFiles('**/package-lock.json') }}

      - name: Code Building
        run: |
          npm run build

